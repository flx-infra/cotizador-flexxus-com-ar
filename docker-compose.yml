# ---------------------------------------------------------------------------
# Cotizador Comercial Flexxus - cotizador.flexxus.com.ar
#
# Codigo e imagen: proyecto flxCotizadorComercial (Dockerfile en la raiz).
# Este repo es solo el stack: lo que Portainer despliega.
#
#   /            vista del cliente (publica)
#   /cotizador/  cotizador interno, con usuario y clave
# Sin estado, sin volumenes.
#
# Variables que hay que cargar en el stack: SERVICE_NAME, NODE, LOKI_URL,
# DOMAIN_NAME (cotizador.flexxus.com.ar), COTIZADOR_USER, COTIZADOR_PASSWORD.
# Opcional: HTTP_PORT (puerto interno directo, por defecto 7006).
#
# TAG: version de la imagen que corre en este entorno. La pone el pipeline de
# Bitbucket en cada deploy (flx-cotizador-comercial, rama develop -> staging).
# Rollback: cambiar TAG en el stack de Portainer y Update con re-pull.
# ---------------------------------------------------------------------------
version: '3.6'

services:
  cotizador:
    image: fabreguesm/cotizador-comercial:${TAG:-0.1.1}
    hostname: cotizador-flexxus-com-ar
    # Puerto directo en la red interna (http, sin TLS), para probar sin
    # depender del dominio: http://<ip de cualquier nodo>:7006/
    # HTTP_PORT es opcional en el stack. Quitarlo cuando el dominio ande, o
    # tenerlo presente: por aca la clave de /cotizador/ viaja sin cifrar.
    ports:
      - "${HTTP_PORT:-7006}:80"
    networks:
      - traefik
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - COTIZADOR_USER=${COTIZADOR_USER}
      - COTIZADOR_PASSWORD=${COTIZADOR_PASSWORD}
    deploy:
      placement:
        constraints: ["${NODE}"]
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${SERVICE_NAME}-http.entrypoints=web"
        - "traefik.http.routers.${SERVICE_NAME}-http.rule=Host(`${DOMAIN_NAME}`)"
        - "traefik.http.middlewares.${SERVICE_NAME}-http.redirectscheme.scheme=https"
        - "traefik.http.routers.${SERVICE_NAME}-https.rule=Host(`${DOMAIN_NAME}`)"
        - "traefik.http.routers.${SERVICE_NAME}-https.entrypoints=https"
        - "traefik.http.routers.${SERVICE_NAME}-https.tls=true"
        - "traefik.http.routers.${SERVICE_NAME}-https.tls.certresolver=myresolver"
        - "traefik.http.services.${SERVICE_NAME}-http.loadbalancer.server.port=80"
      restart_policy:
        condition: any
        delay: 10s
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}

# Sin volumenes a proposito: el contenido sale entero de la imagen, y la clave
# de /cotizador/ se arma al arrancar desde las variables. Los presupuestos que
# genera cada asesor quedan en su navegador y en la planilla del Apps Script.

networks:
  traefik:
    external: true
    name: traefik-network
